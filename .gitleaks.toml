# Reglas de gitleaks: las default + reglas propias del proyecto.
title = "TheDirectorsCut"

[extend]
useDefault = true

[[rules]]
id = "unreal-online-credentials"
description = "Credenciales de servicios online en .ini de Unreal (EOS, Steam, etc.)"
regex = '''(?i)(ClientSecret|ClientId|DeploymentId|SteamDevAppId|ApiKey|EncryptionKey)\s*=\s*["']?[A-Za-z0-9_\-+/=]{12,}'''
path = '''\.ini$'''

[[rules]]
id = "vkvm-or-lan-token"
description = "Tokens de emparejamiento o de LAN"
regex = '''(?i)(pair(ing)?_?token|vkvm_?(token|key|secret))\s*[:=]\s*["']?[A-Za-z0-9_\-]{12,}'''

[allowlist]
description = "Ejemplos y evidencias"
paths = [
  '''\.env\.example$''',
  '''docs/evidence/.*\.(png|jpg)$''',
]
