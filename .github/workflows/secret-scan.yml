name: secret-scan
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # auditoría semanal completa (lunes 06:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Instalar gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Escanear todo el historial
        run: gitleaks git --redact --no-banner --config .gitleaks.toml --exit-code 1 .
